schema_version: ara.research_lab.v1
lab_id: abra
system_name: ABRA
full_name: Automated Blockchain Research Agents
domain: blockchain_security
description: Agentic blockchain security research lab for static analysis, incident replay, evidence review, and paper-ready reporting.

legacy:
  repo_names:
    - blockchain-security
  lab_ids:
    - blockchain-security
    - blockchain_security

entrypoints:
  agent_cli:
    - python3 -m abra
  direct_tools:
    - python3 tools/scanner.py
    - python3 tools/replay_runner.py
    - python3 tools/pipeline/run_phase1.py
    - python3 -m abra evidence produce

commands:
  allow_prefixes:
    - python3 -m abra
    - PYTHONPATH=/home/biostar/work/projects/ara python3 -m ara bundles validate
    - abra
    - python3 tools/
    - python3 scanner.py
    - python3 tools/scanner.py
    - python3 tools/replay_runner.py
    - forge test --match-path test/replay/
    - forge test --match-contract
  deny_patterns:
    - rm -rf
    - git reset --hard
    - cast send
    - --broadcast
    - PRIVATE_KEY
    - private-key
    - eth_sendRawTransaction

dispatch:
  commands:
    manifest-inspect:
      argv:
        - python3
        - -m
        - abra
        - labs
        - inspect
        - --json
      side_effect_free: true
      description: Inspect the ABRA research_lab.yaml contract.
    smoke:
      argv:
        - python3
        - -m
        - abra
        - labs
        - smoke
        - --json
      side_effect_free: true
      description: Run side-effect-free ABRA manifest and artifact smoke checks.
    tools-list:
      argv:
        - python3
        - -m
        - abra
        - tools
        - list
        - --json
      side_effect_free: true
      description: List ABRA's preserved domain tools.
    evidence-produce:
      argv:
        - python3
        - -m
        - abra
        - evidence
        - produce
        - --incidents-csv
        - data/processed/incidents_normalized_latest.csv
        - --out-dir
        - data/processed
        - --json
      side_effect_free: false
      description: Produce staged security-evidence enrichment and Alchemy backfill artifacts.
    agent-run-fixture:
      argv:
        - python3
        - -m
        - abra
        - agent
        - run
        - --case-fixture
        - tests/fixtures/replay_case.json
        - --out
        - /tmp/abra_agent_bundle
        - --json
      side_effect_free: false
      description: Run the bounded local ABRA research agent loop over a replay fixture.
    archive-replay-profile:
      argv:
        - python3
        - -m
        - abra
        - replay
        - assess
        - --case-fixture
        - tests/fixtures/replay_case.json
        - --archive-profile
        - tests/fixtures/archive_rpc_profile.json
        - --out
        - /tmp/abra_archive_replay_bundle
        - --json
      side_effect_free: false
      description: Build a deterministic read-only archive replay evidence bundle with L4 fixture-backed claims.
    ara-production-replay-contract:
      argv:
        - python3
        - -m
        - abra
        - replay
        - assess
        - --case-fixture
        - tests/fixtures/replay_case.json
        - --profile
        - ara-production
        - --out
        - /tmp/abra_ara_production_bundle
        - --json
      side_effect_free: false
      description: Build an ARA production contract replay bundle that keeps L1 feasibility blockers out of successful replay drafting.

environment:
  required: []
  optional:
    - ALCHEMY_API_KEY
    - ALCHEMY_RPC_URL
    - ALCHEMY_MAINNET_RPC_URL
    - ALCHEMY_HTTP_URL
    - ETH_RPC_URL
    - POLYGON_RPC_URL
    - BSC_RPC_URL
    - ARBITRUM_RPC_URL
    - OPTIMISM_RPC_URL
    - BASE_RPC_URL
    - AVALANCHE_RPC_URL
    - BLAST_RPC_URL
    - SONIC_RPC_URL
    - MANTLE_RPC_URL
    - LINEA_RPC_URL
    - CELO_RPC_URL
    - POLYGON_ZKEVM_RPC_URL
    - ZKSYNC_RPC_URL
    - BERACHAIN_RPC_URL
    - SOLANA_RPC_URL
    - SUI_RPC_URL
    - ARCHIVE_RPC_URL
    - FOUNDRY_PROFILE

artifacts:
  include:
    - runs/*/evidence_bundle.json
    - runs/*/artifact_manifest.json
    - runs/*/final_report.md
    - runs/*/abra_result_bundle/**
    - runs/*/abra_research_agent_bundle/**
    - data/processed/*.csv
    - data/processed/*.json
    - data/raw/defillama/defillama_hacks_latest.csv
    - data/raw/defillama/defillama_hacks_latest.json
    - reports/*.md
    - reports/events/*.md
    - reports/replay_runs/*.json
    - findings/*.md
    - figures/generated/*
  exclude:
    - .venv/**
    - out/**
    - cache/**

bundles:
  produced:
    - evidence_bundle
    - abra_result_bundle
    - abra_research_agent_bundle

evidence_levels:
  L0: hypothesis
  L1: static_alert
  L2: source_confirmed
  L3: local_reproduced
  L4: fork_replayed
  L5: externally_correlated
  L6: audit_ready

safety:
  max_wall_time_minutes: 240
  network_policy: read_only_rpc
  destructive_commands: false
